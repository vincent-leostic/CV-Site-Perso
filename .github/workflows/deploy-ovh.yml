# Déploiement automatique sur l'hébergement mutualisé OVH (vincent.leostic.bzh)
# à chaque push sur main. Coexiste avec deploy.yml (GitHub Pages).
# Nécessite 3 secrets (Settings → Secrets and variables → Actions) :
#   OVH_FTP_HOST     ftp.cluster131.hosting.ovh.net
#   OVH_FTP_USER     codexog
#   OVH_FTP_PASSWORD mot de passe de l'utilisateur FTP
# Tant que les secrets ne sont pas configurés, le workflow ne fait rien (pas d'échec).
name: Déploiement OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      OVH_READY: ${{ secrets.OVH_FTP_HOST != '' && secrets.OVH_FTP_USER != '' && secrets.OVH_FTP_PASSWORD != '' }}
    steps:
      - name: Secrets absents — déploiement ignoré
        if: env.OVH_READY != 'true'
        run: echo "Secrets OVH_FTP_* non configurés dans GitHub, déploiement ignoré."

      - uses: actions/checkout@v4
        if: env.OVH_READY == 'true'

      - uses: actions/setup-node@v4
        if: env.OVH_READY == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Générer le site statique
        if: env.OVH_READY == 'true'
        run: |
          npm ci
          npm run generate

      # SFTP (port 22) : le FTP d'OVH mutualisé ne supporte pas le FTPS explicite.
      # lftp mirror crée le dossier distant au besoin et synchronise (ajouts,
      # modifications, suppressions). Chemin relatif au home de l'utilisateur FTP.
      - name: Déployer .output/public sur OVH (SFTP)
        if: env.OVH_READY == 'true'
        env:
          OVH_HOST: ${{ secrets.OVH_FTP_HOST }}
          OVH_USER: ${{ secrets.OVH_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          # Espaces parasites parfois collés avec les secrets
          OVH_HOST="$(printf '%s' "$OVH_HOST" | tr -d '[:space:]')"
          OVH_USER="$(printf '%s' "$OVH_USER" | tr -d '[:space:]')"
          lftp --env-password -u "$OVH_USER" "sftp://$OVH_HOST" <<'EOF'
          set sftp:auto-confirm yes
          set net:max-retries 2
          mirror -R --delete --parallel=4 ./.output/public vincent
          bye
          EOF
